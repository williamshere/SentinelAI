[project]
name = "sentinel-ai"
version = "0.2.0"
description = "Low-impact Windows hardware telemetry dashboard"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.6,<6.13",
    "psutil>=5.9",
    "nvidia-ml-py>=12.535.133",
    "gpustat>=1.1.1",
    "wmi>=1.5.1; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
gpu = ["pyopencl>=2024.1", "numpy>=1.26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--ignore-glob=*backup.py", "--ignore-glob=* (*).py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai", "core", "database", "sensors", "ui"]
py-modules = ["app", "config"]
